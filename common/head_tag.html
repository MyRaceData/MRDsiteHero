<script>
  window.loadWeatherWidget = async function() {
    try {
      const response = await fetch('https://myracedata.com/widget.php');
      if (!response.ok) throw new Error('Failed to load weather data.');
      document.getElementById('weather-widget-container').innerHTML = await response.text();
    } catch (error) {
      document.getElementById('weather-widget-container').innerHTML = 'Weather update unavailable.';
    }
  }
  document.addEventListener('DOMContentLoaded', loadWeatherWidget);
</script>
